# Render 蓝图。在 Render 里 New → Blueprint → 选这个仓库，它读这个文件建服务，
# 只会问你两个密文变量的值（key 和访问口令），别的都写死在这儿。
#
# **key 只存在 Render 这边的加密变量里**，不进仓库、不进浏览器。
# 这是让别人「打开就能用」又不泄露 key 的唯一办法。
services:
  - type: web
    name: qiuqiu
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    plan: starter
    region: singapore
    # 免口令，否则平台探活一直失败
    healthCheckPath: /api/health
    # 挂盘之后记忆不会因为重启清空——别人隔天再打开，它还记得上次说过的话。
    # 免费层没有这个，一重启就是空库。
    disk:
      name: qiuqiu-data
      mountPath: /data
      sizeGB: 1
    envVars:
      # sync: false = 不写进仓库，部署时在 Render 界面上填
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      # 语音要另外配；不填就只有文字对话，演示够用
      - key: VOLC_SPEECH_APPID
        sync: false
      - key: VOLC_SPEECH_TOKEN
        sync: false
      - key: DATA_DIR
        value: /data
      # 走真实模型，不用 mock
      - key: MODELS_MOCK
        value: "0"
