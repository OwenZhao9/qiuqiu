[project]
name = "qiuqiu-api"
version = "0.1.0"
description = "FastAPI 服务：路由、对话编排、SSE"
requires-python = ">=3.12,<3.13"
dependencies = [
    "qiuqiu-data",
    "qiuqiu-memory",
    "qiuqiu-models",
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "websockets>=13.0,<16.0",
    "python-multipart>=0.0.9,<1.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "structlog>=25.0.0,<27.0.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qiuqiu_api"]
