[project]
name = "qiuqiu-data"
version = "0.1.0"
description = "存储层：LanceDB / SQLite / 磁盘文件"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lancedb>=0.38.0,<0.39.0",
    "pyarrow>=16.0.0,<25.0.0",
    "numpy>=1.24.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "structlog>=25.0.0,<27.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qiuqiu_data"]
