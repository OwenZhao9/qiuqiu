<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>丘丘</title>
    <script>
      // 首帧之前定主题，避免闪白。design/tokens.css 要求 <html> 上显式写 data-theme。
      (function () {
        try {
          var saved = localStorage.getItem('qq-theme');
          var dark = saved
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <script>
      // 皮肤同理。出厂是 kawaii（契约 § 9），而 tokens.css 的 :root 是素净——
      // 不在首帧之前挂上 data-skin，新装的用户会先看见一帧米色再跳成粉色。
      // 这里的 'kawaii' 与 defaults.ts::FACTORY.skin 必须一致，有测试盯着。
      (function () {
        try {
          var skin = localStorage.getItem('qiuqiu.skin') || 'kawaii';
          if (skin !== 'default') document.documentElement.dataset.skin = skin;
        } catch (e) {
          document.documentElement.dataset.skin = 'kawaii';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
